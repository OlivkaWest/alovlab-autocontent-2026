*{margin:0;padding:0;box-sizing:border-box}
:root{--o:#e8672a;--o2:#ff8a3d;--o3:#ffb066}
html{background:#0a0806}
body{font-family:'Manrope',system-ui,sans-serif;background:#0a0806;color:#fff;-webkit-font-smoothing:antialiased;
padding:clamp(18px,3.5vw,44px) clamp(12px,3vw,30px)}
.page{max-width:1160px;margin:0 auto}
.lead{margin-bottom:24px}.lead .eb{font-weight:800;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--o2)}
.lead h1{font-weight:800;font-size:clamp(18px,3vw,24px);margin:9px 0 0;line-height:1.3;color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}

.slide{position:relative;width:min(540px,92vw);aspect-ratio:4/5;border-radius:22px;overflow:hidden;
background:
 radial-gradient(70% 42% at 88% 6%, rgba(255,130,40,.38), transparent 58%),
 radial-gradient(60% 45% at 50% 84%, rgba(255,110,35,.22), transparent 62%),
 linear-gradient(180deg,#0d0a07,#080605);
padding:42px 44px;display:flex;flex-direction:column;border:1px solid rgba(255,140,60,.08)}

.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:4}
.top .eb{font-weight:800;font-size:13.5px;letter-spacing:.15em;text-transform:uppercase;color:#8c8378}
.top .pg{font-weight:800;font-size:16px;color:var(--o2);font-variant-numeric:tabular-nums}
.top .pg b{color:#6a6157}

.head{margin-top:24px;position:relative;z-index:4}
.head h2{font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.98;font-size:47px;
 transform:scaleX(.9);transform-origin:left}
.head h2 .w{color:#fff;display:block}
.head h2 .o{display:block;background:linear-gradient(180deg,var(--o3),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.body{margin-top:18px;font-size:16.5px;line-height:1.4;max-width:32ch;position:relative;z-index:4}
.body .l{color:#fff;font-weight:600}
.body .m{color:#8a8177;font-weight:500}

.stage{position:absolute;inset:0;z-index:2;pointer-events:none}
.rings{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);z-index:1}
.rings i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,140,60,.10)}
.orbw{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);z-index:3}
.orb{width:162px;height:162px;border-radius:50%;position:relative;
 background:
  radial-gradient(circle at 50% 34%, rgba(255,165,80,.42), rgba(26,16,8,.92) 58%),
  radial-gradient(circle at 50% 118%, rgba(255,120,40,.6), transparent 52%);
 box-shadow: inset 0 -22px 44px rgba(255,120,40,.4), inset 0 14px 32px rgba(0,0,0,.65),
  inset 0 0 0 1px rgba(255,160,90,.25), 0 26px 70px rgba(255,110,30,.28);}
.orb.big{width:210px;height:210px}
.orb::before{content:"";position:absolute;top:9%;left:24%;width:44%;height:26%;border-radius:50%;
 background:radial-gradient(circle, rgba(255,255,255,.3), transparent 70%);filter:blur(4px);z-index:4}
.orb::after{content:"";position:absolute;left:20%;right:20%;bottom:-8%;height:20px;border-radius:50%;
 background:radial-gradient(circle, rgba(255,130,50,.6), transparent 70%);filter:blur(7px)}

.foot{margin-top:auto;display:flex;align-items:center;gap:9px;position:relative;z-index:4}
.foot .mk{width:26px;height:26px;border-radius:7px}
.foot .wm{position:relative;font-weight:800;font-size:19px;color:#e9e2d8;letter-spacing:.01em}
.foot .wm::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:3px;border-radius:2px;
 background:linear-gradient(90deg,var(--o),transparent)}
.sparks{position:absolute;inset:0;z-index:1;pointer-events:none}

/* обложка */
.cover .head h2{font-size:52px}
.cover .sub{margin-top:20px;font-size:19px;line-height:1.4;color:#b9ad9b;max-width:26ch;position:relative;z-index:4}
/* cta */
.cta .clist{margin-top:20px;display:flex;flex-direction:column;gap:11px;position:relative;z-index:4}
.cta .clist .li{display:flex;gap:11px;align-items:flex-start;font-size:16px;color:#b9ad9b;line-height:1.35;max-width:34ch}
.cta .clist .li i{width:8px;height:8px;border-radius:50%;background:var(--o2);flex:0 0 auto;margin-top:6px;box-shadow:0 0 8px 1px rgba(255,140,60,.7)}
.cta .clist .li b{color:#fff;font-weight:700}
.cta .btn{position:relative;z-index:4;align-self:flex-start;margin-top:26px;font-weight:800;font-size:17px;color:#160e07;
 background:linear-gradient(150deg,var(--o2),var(--o));border-radius:13px;padding:16px 26px;box-shadow:0 16px 34px -12px rgba(232,103,42,.8)}

.stagewrap{display:flex;justify-content:center;padding:40px;background:#050403}
.story{position:relative;width:540px;height:960px;background:radial-gradient(125% 75% at 82% 2%,#20140a,#0a0806 58%);
 border-radius:30px;overflow:hidden;padding:36px 30px 24px;display:flex;flex-direction:column;box-shadow:0 40px 90px -30px #000}
.story .eb{position:relative;z-index:3;font-weight:800;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--o2)}
.story h2{position:relative;z-index:3;margin-top:9px;font-weight:800;font-size:46px;line-height:.98;letter-spacing:-.02em;color:#fff}
.story h2 b{color:var(--o2);font-weight:800}
.story .sub{position:relative;z-index:3;margin-top:9px;font-size:15px;color:#c2b6a4;font-weight:600}
.zgrid{position:relative;z-index:3;margin-top:18px;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:13px}
.z{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
 border:1px solid rgba(255,140,60,.16);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;overflow:hidden}
.z .lab{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.03em;color:#fff}
.z .lab .n{width:20px;height:20px;border-radius:6px;background:linear-gradient(150deg,var(--o2),var(--o));color:#160e07;
 font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.z .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;min-height:0}
.z .mc{font-size:10.5px;color:#8a8177;margin-top:8px;font-weight:600;line-height:1.2}
.z .mc b{color:var(--o2)}
.z.off{opacity:.4;filter:saturate(.55)}
.z.on{border-color:var(--o);box-shadow:0 0 0 1.5px var(--o),0 16px 42px -12px rgba(232,103,42,.65);
 background:linear-gradient(180deg,rgba(232,103,42,.16),rgba(255,255,255,.02))}
.z.on .lab .n{box-shadow:0 0 12px 2px rgba(255,140,60,.7)}
.thumb{height:100%;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.13);line-height:0;flex:1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.arrow{color:var(--o2);font-weight:800;font-size:16px;flex:0 0 auto}
.playdot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
 background:rgba(0,0,0,.45);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
/* СЛОВА / ЗНАНИЯ типографика */
.txt{width:100%;display:flex;flex-direction:column;gap:5px}
.pill{align-self:flex-start;font-size:10px;font-weight:800;color:#160e07;background:linear-gradient(150deg,var(--o2),var(--o));border-radius:20px;padding:3px 9px;letter-spacing:.02em}
.ln{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,150,80,.75),rgba(255,150,80,.2))}
.ln.g{background:#3a342c}
.srcs{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:9px;font-weight:700;color:#c9bdac;border:1px solid #4a433a;border-radius:8px;padding:2px 7px}
/* АВАТАР */
.av{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.avhead{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#2a2018,#161009);
 border:1.5px solid rgba(255,150,80,.4);position:relative;flex:0 0 auto;overflow:hidden}
.avhead::before{content:"";position:absolute;left:50%;top:24%;width:15px;height:15px;border-radius:50%;transform:translateX(-50%);background:#6a6157}
.avhead::after{content:"";position:absolute;left:50%;bottom:-3px;width:30px;height:22px;border-radius:50% 50% 0 0;transform:translateX(-50%);background:#6a6157}
.subs{display:flex;flex-direction:column;gap:4px;flex:1;max-width:96px}
.subs .s{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--o2),rgba(255,150,80,.15))}
.motion{position:absolute;right:9px;top:34px;display:flex;flex-direction:column;gap:3px}
.motion i{display:block;width:16px;height:2.5px;border-radius:2px;background:var(--o2);opacity:.85}
.motion i:nth-child(2){width:11px;opacity:.6}.motion i:nth-child(3){width:7px;opacity:.4}
.foot{position:relative;z-index:3;margin-top:16px;display:flex;align-items:center;justify-content:space-between}
.foot .lg{display:flex;align-items:center;gap:9px}
.foot .lg img{width:30px;height:30px;border-radius:8px}
.foot .lg b{font-weight:800;font-size:17px;color:#fff}.foot .lg b i{color:var(--o2);font-style:normal}

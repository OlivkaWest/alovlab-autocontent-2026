<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url('file:///home/user/alovlab-autocontent-2026/assets/fonts/manrope-cyrillic-500.woff2') format('woff2');font-weight:500;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#term{
  width:900px;padding:40px 44px 60px;
  font-family:'SFMono-Regular','DejaVu Sans Mono','Menlo',monospace;
  font-size:30px;line-height:1.62;color:#e7e2db;
  text-shadow:0 0 14px rgba(255,150,60,.22),0 0 3px rgba(255,180,120,.30);
}
.p{color:#57d07a}          /* prompt user@ */
.cmd{color:#f2ede6}
.arw{color:#ff9a4d}        /* › */
.ok{color:#57d07a}
.dim{color:#b9b2aa}
.cta{color:#ff8a3d;font-weight:700}
.cur{display:inline-block;width:16px;height:30px;background:#ff9a4d;transform:translateY(4px);
     box-shadow:0 0 16px rgba(255,150,60,.7)}
.blank{height:20px}
</style></head>
<body><div id="term">
<div><span class="p">user@claude-code</span><span class="cmd">:~$ claude-code</span></div>
<div class="blank"></div>
<div><span class="arw">›</span> <span class="cmd">Ты — мой помощник, я не программист.</span></div>
<div><span class="arw">›</span> <span class="cmd">Задача словами: [что хочу].</span></div>
<div><span class="arw">›</span> <span class="cmd">Дай план, делай по шагу, спрашивай.</span></div>
<div><span class="ok">✓</span> <span class="cmd">Готово — без единой строчки кода.</span></div>
<div class="blank"></div>
<div class="dim"># забери целиком:</div>
<div class="cta"># чек-лист «первый запуск»</div>
<div class="cta"># в комментариях под постом ↓ <span class="cur"></span></div>
</div></body></html>
